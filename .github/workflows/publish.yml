# The publish: a push to main publishes the draft release waiting for the version the shipped .toc
# names, pushes the wiki/ folder to this repository's wiki, then removes wiki/ from main. A second
# job, curseforge, then uploads the release's zip to the CurseForge project the shipped .toc's
# ## X-Curse-Project-ID: line names, a release candidate as beta, with the release body as its
# changelog. It takes CURSEFORGE_API_TOKEN, a secret on this repository, and a failed upload leaves
# the GitHub release published and is retried alone with "Re-run failed jobs". A third job, wago,
# uploads the same zip beside it to the Wago Addons project the ## X-Wago-ID: line names, a release
# candidate as beta, taking WAGO_API_TOKEN, a secret on this repository, in the same way. A fourth
# job, wowi, uploads a final release's zip to the WoWInterface project the ## X-WoWI-ID: line
# names, taking WOWI_API_TOKEN, a secret on this repository, and uploads nothing for a release
# candidate, since WoWInterface has no beta channel.
#
# One zip serves the Retail and the Forever client. Each upload job reads ## Interface: into Retail
# game versions and Forever ones, a 16xxx value being Forever, and tags the upload with both kinds
# on a site that lists them. A Retail version a site does not list fails CurseForge and Wago, where
# a mistyped number is what produces one; a Forever version a site does not list is left out, and
# the job's summary names it with the site's answer.
#
# A release arrives here as a pull request from release/v<version>, carrying the stripped addon,
# LICENSE, wiki/ and this file, beside a draft release for v<version> with the zip attached. Merging
# that pull request is the decision to release. A push runs the workflow file in the pushed commit,
# so the merged commit's own copy of this file is the one that runs, the first release included.
#
# A commit carrying no shipped .toc publishes nothing, and the summary says so. A release already
# published for the version with its tag on this commit is a rerun: the release is left as it is and
# the wiki push runs again. A version already published at another commit publishes nothing either.
# A version with no draft waiting and no published release fails: the merge has moved main to a new
# addon with no release behind it.
#
# The draft is read before it is published, and one carrying no zip, the wrong pre-release flag,
# another tag, or a zip whose entries differ by name or by bytes from WowPvpHistory/ in the merged
# commit fails the run with the draft left as it is. Publishing cannot be undone, so the check
# comes first. The release branch stays editable until it is merged, and the three upload jobs send
# the draft's zip while reading their project ids off the merged commit, so the zip is compared
# with the commit and not only counted. Trap: checked after the publish, a draft with no zip was published, made latest and
# tagged, and the version could not be released again.
#
# The release is published with GITHUB_TOKEN, which sets its target to the pushed commit and creates
# the tag there. The wiki push takes PUBLIC_WIKI_TOKEN, a secret on this repository, since
# GITHUB_TOKEN is not known to push to a wiki repository. A wiki push that fails leaves the release
# published and fails the run, and rerunning the job pushes the wiki once the token can. The commit
# removing wiki/ is pushed with GITHUB_TOKEN, and a push made with that token starts no workflow.
#
# This file is copied here by every release and is edited where the release run keeps it.

name: publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Publishing the release and pushing the commit that removes wiki/ write to this repository.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      state: ${{ steps.release.outputs.state }}

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A commit carrying no shipped .toc, the first commit holding LICENSE alone, has no version and
      # publishes nothing. A .toc whose one ## Version: line is not X.Y.Z or X.Y.Z-rc.N fails.
      - name: Read the version off the shipped .toc
        id: version
        shell: pwsh
        run: |
          $toc = 'WowPvpHistory/WowPvpHistory.toc'
          if (-not (Test-Path -LiteralPath $toc -PathType Leaf)) {
            Write-Host "version: this commit carries no $toc, so there is no release to publish"
            'version=' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $lines = @(Get-Content -LiteralPath $toc | Where-Object { $_ -match '^##\s*Version:' })
          if ($lines.Count -ne 1) {
            Write-Host "::error title=version::$toc carries $($lines.Count) ## Version: lines where one was expected."
            exit 1
          }
          if ($lines[0] -cnotmatch '^##\s*Version:\s*(\d+\.\d+\.\d+(-rc\.[1-9]\d*)?)\s*$') {
            Write-Host "::error title=version::The ## Version: line of $toc names no release version."
            exit 1
          }
          $version = $Matches[1]
          $prerelease = if ($Matches[2]) { 'true' } else { 'false' }
          Write-Host "version: $version, a pre-release: $prerelease"
          "version=$version", "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The releases are listed rather than looked up by tag, since a lookup by tag never returns a
      # draft. The read-back compares the tag's commit with the pushed one, because the publish call
      # answering 200 says nothing about where the tag landed.
      - name: Publish the draft release waiting for the version
        id: release
        if: steps.version.outputs.version != ''
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Compares a zip with a directory: each entry name against the file paths under Prefix/, then
          # every entry's bytes against its file's. Returns the entry count, the file count and one line
          # per difference. Trap: a count or a total size matches after an edit of equal length, so
          # every entry is read whole.
          function Compare-DraftZip {
            param([string] $Zip, [string] $Tree, [string] $Prefix)
            Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
            $root = [System.IO.Path]::GetFullPath($Tree)
            $files = [System.Collections.Generic.Dictionary[string, string]]::new([System.StringComparer]::Ordinal)
            foreach ($f in @(Get-ChildItem -LiteralPath $root -Recurse -File -Force)) {
              $files["$Prefix/$([System.IO.Path]::GetRelativePath($root, $f.FullName).Replace('\', '/'))"] = $f.FullName
            }
            $differences = [System.Collections.Generic.List[string]]::new()
            $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $entries = 0
            $archive = [System.IO.Compression.ZipFile]::OpenRead($Zip)
            try {
              foreach ($entry in $archive.Entries) {
                $entries++
                $name = $entry.FullName
                if (-not $seen.Add($name)) { $differences.Add("$name is in the zip twice"); continue }
                if (-not $files.ContainsKey($name)) { $differences.Add("$name is in the zip and not in this commit"); continue }
                $buffer = [System.IO.MemoryStream]::new()
                $stream = $entry.Open()
                try { $stream.CopyTo($buffer) } finally { $stream.Dispose() }
                $zipped = [Convert]::ToBase64String($buffer.ToArray())
                if ($zipped -cne [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($files[$name]))) { $differences.Add("$name differs from this commit's copy") }
              }
            }
            finally { $archive.Dispose() }
            foreach ($name in $files.Keys) { if (-not $seen.Contains($name)) { $differences.Add("$name is in this commit and not in the zip") } }
            return [pscustomobject]@{ Entries = $entries; Files = $files.Count; Differences = @($differences) }
          }
          $tag = "v$env:VERSION"
          $prerelease = $env:PRERELEASE -eq 'true'
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $all = [System.Collections.Generic.List[object]]::new()
          for ($page = 1; ; $page++) {
            # Trap: Invoke-RestMethod writes a JSON list as one object, so piping the call straight into
            # Where-Object hands it the whole list as one row. Assigned first, the list is walked row by row.
            $answer = Invoke-RestMethod -Uri "$api/releases?per_page=100&page=$page" -TimeoutSec 60 -Headers $headers
            $rows = @($answer | Where-Object { $null -ne $_ })
            foreach ($row in $rows) { $all.Add($row) }
            if ($rows.Count -lt 100) { break }
          }
          $drafts = @($all | Where-Object { $_.draft -eq $true -and $_.tag_name -ceq $tag })
          $published = @($all | Where-Object { $_.draft -eq $false -and $_.tag_name -ceq $tag })
          if ($drafts.Count -gt 1) {
            Write-Host "::error title=release::$($drafts.Count) draft releases wait for $tag, so which one to publish is not settled."
            exit 1
          }
          $tagAt = {
            $code = 0
            $ref = Invoke-RestMethod -Uri "$api/git/ref/tags/$tag" -TimeoutSec 60 -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
            # Trap: a 404 alone says the tag is absent. Any other answer is a read that failed, and read
            # as no tag it sends the run green over a summary nothing read.
            if ($code -eq 404) { return '' }
            if ($code -ne 200) { Write-Host "::error title=release::Reading the tag $tag answered $code, so where it points is not known."; exit 1 }
            if ($ref.object.type -cne 'commit') { return "a $($ref.object.type) object" }
            return [string]$ref.object.sha
          }
          if ($drafts.Count -eq 0) {
            if ($published.Count -eq 1 -and (& $tagAt) -ceq $env:GITHUB_SHA) {
              Write-Host "release: $tag is already published with its tag on $env:GITHUB_SHA, so this is a rerun and only the wiki push runs again"
              "state=already", "url=$($published[0].html_url)", "tag_commit=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
            if ($published.Count -ge 1) {
              Write-Host "release: no draft release for $tag was waiting and $tag is published at another commit, so nothing is published"
              'state=none' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
            Write-Host "::error title=release::No draft release for $tag is waiting and none is published, so main now carries $tag with no release. Tag a new candidate number to publish it."
            exit 1
          }
          $draft = $drafts[0]
          Write-Host "read before publishing: draft $($draft.id) for $($draft.tag_name), pre-release $($draft.prerelease), $(@($draft.assets).Count) asset(s)"
          if ($draft.tag_name -cne $tag) { Write-Host "::error title=release::The draft names $($draft.tag_name) where $tag was expected, so it is left a draft."; exit 1 }
          if ($draft.prerelease -ne $prerelease) { Write-Host "::error title=release::The draft reads pre-release $($draft.prerelease) and $tag is $(if ($prerelease) { 'a candidate' } else { 'a final release' }), so it is left a draft."; exit 1 }
          if (@($draft.assets).Count -ne 1) { Write-Host "::error title=release::The draft carries $(@($draft.assets).Count) assets where the zip is one, so it is left a draft."; exit 1 }
          $asset = @($draft.assets)[0]
          $zip = Join-Path $env:RUNNER_TEMP 'draft.zip'
          Invoke-WebRequest -Uri $asset.url -TimeoutSec 300 -Headers @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/octet-stream' } -OutFile $zip
          $compared = Compare-DraftZip -Zip $zip -Tree 'WowPvpHistory' -Prefix 'WowPvpHistory'
          Write-Host "read before publishing: the zip holds $($compared.Entries) entries and WowPvpHistory/ in this commit $($compared.Files) files, $($compared.Differences.Count) differing by name or bytes"
          if ($compared.Differences.Count -gt 0) {
            foreach ($d in @($compared.Differences | Select-Object -First 20)) { Write-Host "  $d" }
            Write-Host "::error title=release::The draft's zip and WowPvpHistory/ in this commit differ in $($compared.Differences.Count) place(s), so it is left a draft. Tag a new candidate number to build the release from the merged tree."
            exit 1
          }
          $body = @{
            target_commitish = $env:GITHUB_SHA
            draft            = $false
            prerelease       = $prerelease
            make_latest      = if ($prerelease) { 'false' } else { 'true' }
          } | ConvertTo-Json
          $null = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($draft.id)" -TimeoutSec 60 -Headers $headers -Body $body -ContentType 'application/json'
          $read = Invoke-RestMethod -Uri "$api/releases/$($draft.id)" -TimeoutSec 60 -Headers $headers
          $at = & $tagAt
          Write-Host "read back: release $($read.html_url), draft $($read.draft), pre-release $($read.prerelease), $(@($read.assets).Count) asset(s)"
          Write-Host "read back: $tag at $(if ($at) { $at } else { 'nothing' }) against $env:GITHUB_SHA pushed"
          if ($read.draft -ne $false) { Write-Host "::error title=release::The release for $tag still reads as a draft."; exit 1 }
          if ($read.prerelease -ne $prerelease) { Write-Host "::error title=release::The release reads pre-release $($read.prerelease) and $tag is $(if ($prerelease) { 'a candidate' } else { 'a final release' })."; exit 1 }
          if (@($read.assets).Count -ne 1) { Write-Host "::error title=release::The release carries $(@($read.assets).Count) assets where the zip is one."; exit 1 }
          if ($at -cne $env:GITHUB_SHA) { Write-Host "::error title=release::The tag $tag is not on the pushed commit $env:GITHUB_SHA."; exit 1 }
          Write-Host "release: $tag published at $env:GITHUB_SHA"
          "state=published", "url=$($read.html_url)", "tag_commit=$at" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Runs where a release was published by this run or by the run it reruns. The wiki repository
      # takes its whole content from wiki/, and an unchanged tree commits and pushes nothing.
      - name: Push the wiki folder to this repository's wiki
        id: wiki
        if: steps.release.outputs.state == 'published' || steps.release.outputs.state == 'already'
        shell: pwsh
        env:
          WIKI_TOKEN: ${{ secrets.PUBLIC_WIKI_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $finish = "The release v$env:VERSION is published and its wiki is not; rerun this job once PUBLIC_WIKI_TOKEN can push to the wiki."
          if ([string]::IsNullOrWhiteSpace($env:WIKI_TOKEN)) { Write-Host "::error title=wiki::PUBLIC_WIKI_TOKEN is not set. $finish"; exit 1 }
          $pages = @(Get-ChildItem -LiteralPath 'wiki' -File -Filter '*.md' -ErrorAction SilentlyContinue)
          if ($pages.Count -eq 0) { Write-Host "::error title=wiki::This commit carries no page under wiki/, so there is nothing to push. $finish"; exit 1 }
          $basic = [Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("x-access-token:$env:WIKI_TOKEN"))
          Write-Host "::add-mask::$basic"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GIT_AUTHOR_NAME = $env:GIT_COMMITTER_NAME = 'github-actions[bot]'
          $env:GIT_AUTHOR_EMAIL = $env:GIT_COMMITTER_EMAIL = '41898283+github-actions[bot]@users.noreply.github.com'
          $work = Join-Path $env:RUNNER_TEMP 'wiki-clone'
          $cloned = @(& git clone -q "https://github.com/$env:GITHUB_REPOSITORY.wiki.git" $work 2>&1)
          if ($LASTEXITCODE -ne 0) {
            $cloned | ForEach-Object { Write-Host "  $_" }
            Write-Host "::error title=wiki::Cloning the wiki answered $LASTEXITCODE; a token that cannot read it answers the same as a wiki with no page. $finish"
            exit 1
          }
          Get-ChildItem -LiteralPath $work -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath 'wiki' -Force | Copy-Item -Destination $work -Recurse -Force
          & git -C $work add -A
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=wiki::git add answered $LASTEXITCODE. $finish"; exit 1 }
          # Trap: a listing told to keep quiet counts a folder it could not read as holding nothing, so
          # only an absent folder reads as no images and a refused one stops the step.
          $images = 0
          if (Test-Path -LiteralPath 'wiki/images') { $images = @(Get-ChildItem -LiteralPath 'wiki/images' -Recurse -File -ErrorAction Stop).Count }
          # Trap: a status that fails prints nothing, which reads as unchanged and lets the prune step
          # remove wiki/ from main with no wiki push behind it, so the exit code is read first.
          $status = @(& git -C $work status --porcelain)
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=wiki::git status answered $LASTEXITCODE. $finish"; exit 1 }
          if ($status.Count -eq 0) {
            Write-Host "wiki: unchanged, the wiki already carries these $($pages.Count) pages and $images images, so nothing is committed or pushed"
            'state=unchanged', "pages=$($pages.Count)", "images=$images" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          & git -C $work commit -q -m "wiki: $env:VERSION"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=wiki::git commit answered $LASTEXITCODE. $finish"; exit 1 }
          $local = (& git -C $work rev-parse HEAD).Trim()
          & git -C $work push -q origin 'HEAD:refs/heads/master'
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=wiki::git push answered $LASTEXITCODE. $finish"; exit 1 }
          $remote = @(& git -C $work ls-remote origin refs/heads/master)
          $read = if ($remote.Count -eq 1) { ($remote[0] -split '\s+')[0] } else { '' }
          Write-Host "read back: wiki master at $(if ($read) { $read } else { 'nothing' }) against $local pushed"
          if ($read -cne $local) { Write-Host "::error title=wiki::The wiki's master reads '$read' and the commit pushed is $local. $finish"; exit 1 }
          Write-Host "wiki: $local pushed, $($pages.Count) pages and $images images"
          'state=pushed', "commit=$local", "pages=$($pages.Count)", "images=$images" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Runs once the wiki push succeeded, so main keeps the addon, the README, LICENSE and this file,
      # and the pages live only on the wiki; the README reads its pictures from the wiki. It works on
      # main's tip rather than the pushed commit and pushes without force, so a main that moved during
      # the step refuses the push rather than losing a commit.
      - name: Remove the wiki folder from main
        id: prune
        if: steps.wiki.outcome == 'success'
        shell: pwsh
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $finish = "The release v$env:VERSION and its wiki are published, and wiki/ is still on main; rerun this job to remove it."
          if (-not [string]::IsNullOrWhiteSpace($env:PUSH_TOKEN)) {
            $basic = [Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("x-access-token:$env:PUSH_TOKEN"))
            Write-Host "::add-mask::$basic"
            $env:GIT_CONFIG_COUNT = '1'
            $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
            $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          }
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GIT_AUTHOR_NAME = $env:GIT_COMMITTER_NAME = 'github-actions[bot]'
          $env:GIT_AUTHOR_EMAIL = $env:GIT_COMMITTER_EMAIL = '41898283+github-actions[bot]@users.noreply.github.com'
          & git fetch -q origin main
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=prune::Fetching main answered $LASTEXITCODE. $finish"; exit 1 }
          $tip = (& git rev-parse FETCH_HEAD).Trim()
          # Trap: a listing that fails prints nothing, which reads as a main carrying no wiki/.
          $listed = @(& git ls-tree -d --name-only $tip -- wiki)
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=prune::git ls-tree answered $LASTEXITCODE. $finish"; exit 1 }
          if ($listed.Count -eq 0) {
            Write-Host "prune: main at $tip carries no wiki/, so nothing is removed"
            'state=absent', "commit=$tip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          & git checkout -q --detach $tip
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=prune::Checking out main answered $LASTEXITCODE. $finish"; exit 1 }
          & git rm -r -q -- wiki
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=prune::git rm answered $LASTEXITCODE. $finish"; exit 1 }
          & git commit -q -m "release: v$env:VERSION publishes the wiki to the repository"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=prune::git commit answered $LASTEXITCODE. $finish"; exit 1 }
          $local = (& git rev-parse HEAD).Trim()
          & git push -q origin 'HEAD:refs/heads/main'
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=prune::git push answered $LASTEXITCODE, which a main that moved during this step also answers. $finish"; exit 1 }
          $remote = @(& git ls-remote origin refs/heads/main)
          $read = if ($remote.Count -eq 1) { ($remote[0] -split '\s+')[0] } else { '' }
          Write-Host "read back: main at $(if ($read) { $read } else { 'nothing' }) against $local pushed"
          if ($read -cne $local) { Write-Host "::error title=prune::main reads '$read' and the commit pushed is $local. $finish"; exit 1 }
          Write-Host "prune: wiki/ removed from main at $local"
          'state=removed', "commit=$local" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Always, because the summary is most worth reading on the run that failed, and printed to the
      # console as well as written to the run page.
      - name: Put the summary on the run
        if: always()
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_STATE: ${{ steps.release.outputs.state }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          TAG_COMMIT: ${{ steps.release.outputs.tag_commit }}
          WIKI_OUTCOME: ${{ steps.wiki.outcome }}
          WIKI_STATE: ${{ steps.wiki.outputs.state }}
          WIKI_COMMIT: ${{ steps.wiki.outputs.commit }}
          WIKI_PAGES: ${{ steps.wiki.outputs.pages }}
          WIKI_IMAGES: ${{ steps.wiki.outputs.images }}
          PRUNE_OUTCOME: ${{ steps.prune.outcome }}
          PRUNE_STATE: ${{ steps.prune.outputs.state }}
          PRUNE_COMMIT: ${{ steps.prune.outputs.commit }}
        run: |
          $out = @('## Publish', '', '```text')
          $out += "commit   $env:GITHUB_SHA"
          if ($env:VERSION_OUTCOME -ne 'success') { $out += "version  not read, the version step reads $env:VERSION_OUTCOME" }
          elseif (-not $env:VERSION) { $out += 'version  none, this commit carries no shipped .toc', 'release: nothing published' }
          else { $out += "version  $env:VERSION" }
          if ($env:VERSION) {
            if ($env:RELEASE_OUTCOME -ne 'success') { $out += "release: not published, the release step reads $(if ($env:RELEASE_OUTCOME) { $env:RELEASE_OUTCOME } else { 'not run' })" }
            elseif ($env:RELEASE_STATE -eq 'none') { $out += "release: no draft for v$env:VERSION was waiting and it is published at another commit, so nothing published" }
            elseif ($env:RELEASE_STATE -eq 'already') { $out += "release: already published, $env:RELEASE_URL", "tag      v$env:VERSION at $env:TAG_COMMIT" }
            else { $out += "release: published $env:RELEASE_URL", "tag      v$env:VERSION at $env:TAG_COMMIT" }
          }
          if ($env:RELEASE_STATE -in 'published', 'already') {
            if ($env:WIKI_OUTCOME -eq 'success' -and $env:WIKI_STATE -eq 'unchanged') { $out += "wiki: unchanged, $env:WIKI_PAGES pages and $env:WIKI_IMAGES images already there" }
            elseif ($env:WIKI_OUTCOME -eq 'success') { $out += "wiki: $env:WIKI_COMMIT pushed, $env:WIKI_PAGES pages and $env:WIKI_IMAGES images" }
            else { $out += "wiki: not pushed, the wiki step reads $(if ($env:WIKI_OUTCOME) { $env:WIKI_OUTCOME } else { 'not run' })" }
            if ($env:PRUNE_OUTCOME -eq 'success' -and $env:PRUNE_STATE -eq 'absent') { $out += "main: carries no wiki/ at $env:PRUNE_COMMIT" }
            elseif ($env:PRUNE_OUTCOME -eq 'success') { $out += "main: wiki/ removed at $env:PRUNE_COMMIT" }
            else { $out += "main: wiki/ not removed, the prune step reads $(if ($env:PRUNE_OUTCOME) { $env:PRUNE_OUTCOME } else { 'not run' })" }
          }
          else { $out += 'wiki: not pushed, no release was published' }
          $out += '```'
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $out | Write-Host

  # The CurseForge upload: the zip the GitHub release carries goes to the CurseForge project the
  # shipped .toc names, so both places carry one file. It runs where the publish job published the
  # release in this run or found it already published at this commit, and a separate job means
  # "Re-run failed jobs" retries the upload alone, without the publish or the wiki push.
  curseforge:
    name: curseforge
    needs: publish
    if: needs.publish.outputs.state == 'published' || needs.publish.outputs.state == 'already'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # An Interface number names its game version by digit pairs, 120100 being 12.1.0 and 120007
      # being 12.0.7. A value that is no interface number fails rather than being left out, since an
      # upload missing a version is hidden from players on it and nothing says so. A 16xxx value is
      # the Forever client's, as the BigWigs packager reads it (L2, its release.sh, read 2026-10-24),
      # and goes to the forever output; every other value is Retail and goes to versions.
      - name: Read the CurseForge project and game versions off the shipped .toc
        id: curseforge-toc
        shell: pwsh
        run: |
          $toc = 'WowPvpHistory/WowPvpHistory.toc'
          if (-not (Test-Path -LiteralPath $toc -PathType Leaf)) {
            Write-Host "::error title=curseforge::This commit carries no $toc to read the CurseForge project off."
            exit 1
          }
          $lines = @(Get-Content -LiteralPath $toc)
          $ids = @($lines | Where-Object { $_ -match '^##\s*X-Curse-Project-ID:' })
          if ($ids.Count -ne 1) {
            Write-Host "::error title=curseforge::$toc carries $($ids.Count) ## X-Curse-Project-ID: lines where one was expected."
            exit 1
          }
          if ($ids[0] -notmatch '^##\s*X-Curse-Project-ID:\s*([1-9]\d*)\s*$') {
            Write-Host "::error title=curseforge::The ## X-Curse-Project-ID: line of $toc names no numeric project."
            exit 1
          }
          $project = $Matches[1]
          $interfaces = @($lines | Where-Object { $_ -match '^##\s*Interface:' })
          if ($interfaces.Count -ne 1) {
            Write-Host "::error title=curseforge::$toc carries $($interfaces.Count) ## Interface: lines where one was expected."
            exit 1
          }
          $names = [System.Collections.Generic.List[string]]::new()
          $forever = [System.Collections.Generic.List[string]]::new()
          foreach ($value in (($interfaces[0] -replace '^##\s*Interface:', '').Trim() -split '\s*,\s*')) {
            if ($value -notmatch '^[1-9]\d{4,5}$') {
              Write-Host "::error title=curseforge::The ## Interface: value '$value' is no interface number, so no game version can be named for it."
              exit 1
            }
            $n = [int]$value
            $name = '{0}.{1}.{2}' -f [int][math]::Truncate($n / 10000), ([int][math]::Truncate($n / 100) % 100), ($n % 100)
            # Trap: 16001 by digit pairs is 1.60.1, a name in the range CurseForge lists Classic under, so it is never matched as a Retail version.
            $into = $names
            if ($value -match '^16\d{3}$') { $into = $forever }
            if (-not $into.Contains($name)) { $into.Add($name) }
          }
          Write-Host "curseforge: project $project, game versions $($names -join ', '), Forever $(if ($forever.Count -gt 0) { $forever -join ', ' } else { 'none' })"
          "project=$project", "versions=$($names -join ',')", "forever=$($forever -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # CurseForge's API lists no project's files (L3, its API article, modified 2026-09-27), so a
      # second copy is told apart off this run's own earlier attempts: an attempt whose curseforge
      # job succeeded uploaded the file or found it uploaded. "Re-run all jobs" after a green run
      # skips, and "Re-run failed jobs" after a failed upload uploads.
      - name: Read whether an earlier attempt of this run uploaded the file
        id: curseforge-rerun
        shell: pwsh
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $attempt = [int]$env:GITHUB_RUN_ATTEMPT
          $found = 0
          if ($attempt -gt 1) {
            $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $headers = @{ Authorization = "Bearer $env:READ_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            for ($n = 1; $n -lt $attempt; $n++) {
              $jobs = Invoke-RestMethod -Uri "$api/attempts/$n/jobs?per_page=100" -TimeoutSec 60 -Headers $headers
              if (@($jobs.jobs | Where-Object { $_.name -ceq 'curseforge' -and $_.conclusion -ceq 'success' }).Count -gt 0) { $found = $n; break }
            }
          }
          if ($found -gt 0) { Write-Host "rerun: attempt $found of this run uploaded the file, so attempt $attempt uploads nothing" }
          else { Write-Host "rerun: none of the $($attempt - 1) earlier attempt(s) of this run uploaded the file" }
          "uploaded=$(if ($found -gt 0) { 'true' } else { 'false' })", "attempt=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The CurseForge token is handed to this step alone, in a header from the environment, never on
      # a command line or in a URL. The changelog is the release body, which the release run already
      # searched for the source author, and the display name is fixed text.
      #
      # Each name is matched inside its game type, by gameVersionTypeID, since one name can sit under
      # several types: Retail is 517 and Forever 88568, the ids the BigWigs packager matches on (L2,
      # its release.sh, read 2026-10-24). Both kinds go into one gameVersions list for one upload. A
      # Retail name CurseForge does not list fails the job, a mistyped number being what produces one;
      # a Forever name it does not list is left out and named. If 88568 stops matching, the type ids
      # are listed at /api/game/version-types with the same token.
      - name: Upload the release zip to CurseForge
        id: curseforge-upload
        if: steps.curseforge-rerun.outputs.uploaded != 'true'
        shell: pwsh
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          PROJECT: ${{ steps.curseforge-toc.outputs.project }}
          VERSIONS: ${{ steps.curseforge-toc.outputs.versions }}
          FOREVER: ${{ steps.curseforge-toc.outputs.forever }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The message of an annotation escapes percent, CR and LF, so a host's answer stays one message and
          # no line of it reads as a workflow command. The title is a fixed word and is not escaped.
          function Protect-Message([string] $Text) { $Text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A') }
          $finish = "The release v$env:VERSION is published on GitHub and not on CurseForge; use Re-run failed jobs once this is fixed."
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_TOKEN)) { Write-Host "::error title=curseforge::CURSEFORGE_API_TOKEN is not set on this repository. $finish"; exit 1 }
          if ([string]::IsNullOrWhiteSpace($env:VERSION) -or [string]::IsNullOrWhiteSpace($env:PROJECT) -or [string]::IsNullOrWhiteSpace($env:VERSIONS)) {
            Write-Host "::error title=curseforge::The version, the project or the game versions did not reach this step. $finish"
            exit 1
          }
          $cf = 'https://wow.curseforge.com/api'
          $cfHeaders = @{ 'X-Api-Token' = $env:CURSEFORGE_TOKEN }
          $code = 0
          # Trap: wrapped in @() the call's one-object list becomes a list of one, so it is assigned first.
          $answer = Invoke-RestMethod -Uri "$cf/game/versions" -TimeoutSec 60 -Headers $cfHeaders -SkipHttpErrorCheck -StatusCodeVariable code
          $listed = @($answer)
          if ($code -ne 200) { Write-Host "::error title=curseforge::CurseForge's game version list answered $code. $finish"; exit 1 }
          $versionIds = [System.Collections.Generic.List[int]]::new()
          $sent = [System.Collections.Generic.List[string]]::new()
          $left = [System.Collections.Generic.List[string]]::new()
          foreach ($kind in @(@{ Name = 'Retail'; Type = 517; Values = $env:VERSIONS }, @{ Name = 'Forever'; Type = 88568; Values = $env:FOREVER })) {
            $typed = @($listed | Where-Object { $null -ne $_ -and $_.PSObject.Properties['name'] -and $_.PSObject.Properties['gameVersionTypeID'] -and [string]$_.gameVersionTypeID -ceq [string]$kind.Type })
            foreach ($name in @(([string]$kind.Values -split ',') | Where-Object { $_ })) {
              $match = @($typed | Where-Object { [string]$_.name -ceq $name })
              if ($match.Count -eq 0 -and $kind.Name -ceq 'Forever') {
                $left.Add("$name (Forever: CurseForge lists no version of that name under type $($kind.Type), of $($typed.Count) there)")
                Write-Host "curseforge: Forever $name is left out, CurseForge lists no version of that name under type $($kind.Type), of $($typed.Count) there"
                continue
              }
              if ($match.Count -eq 0) { Write-Host "::error title=curseforge::CurseForge lists no $($kind.Name) game version named $name under type $($kind.Type), of $($typed.Count) there and $($listed.Count) listed. $finish"; exit 1 }
              if ($match.Count -gt 1) { Write-Host "::error title=curseforge::CurseForge lists $($match.Count) $($kind.Name) game versions named $name under type $($kind.Type), ids $(@($match.id) -join ', '), so which one is not settled. $finish"; exit 1 }
              $versionIds.Add([int]$match[0].id)
              $sent.Add($name)
              Write-Host "game version: $($kind.Name) $name is id $($match[0].id) under type $($kind.Type)"
            }
          }
          if ($versionIds.Count -eq 0) { Write-Host "::error title=curseforge::No game version reached the upload. $finish"; exit 1 }
          "sent=$($sent -join ',')", "left=$($left -join '; ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod -Uri "$api/releases/tags/v$env:VERSION" -TimeoutSec 60 -Headers $headers
          $assets = @($release.assets)
          if ($assets.Count -ne 1 -or -not ([string]$assets[0].name).EndsWith('.zip')) { Write-Host "::error title=curseforge::The release v$env:VERSION carries $($assets.Count) assets where the zip is one. $finish"; exit 1 }
          if ([string]::IsNullOrWhiteSpace($release.body)) { Write-Host "::error title=curseforge::The release v$env:VERSION carries no body to send as the changelog. $finish"; exit 1 }
          $zip = Join-Path $env:RUNNER_TEMP $assets[0].name
          Invoke-WebRequest -Uri $assets[0].url -TimeoutSec 300 -Headers @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/octet-stream' } -OutFile $zip
          $size = (Get-Item -LiteralPath $zip).Length
          if ($size -ne [long]$assets[0].size) { Write-Host "::error title=curseforge::The zip downloaded at $size bytes and the release lists $($assets[0].size). $finish"; exit 1 }
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseType = if ($env:PRERELEASE -eq 'true') { 'beta' } else { 'release' }
          $metadata = [ordered]@{
            changelog     = [string]$release.body
            changelogType = 'markdown'
            displayName   = "PvPHistory $env:VERSION"
            gameVersions  = [int[]]$versionIds.ToArray()
            releaseType   = $releaseType
          } | ConvertTo-Json -Depth 3 -Compress
          Write-Host "uploading: $($assets[0].name), $size bytes, sha256 $sha, $releaseType, game version ids $($versionIds -join ', ')"
          $response = Invoke-RestMethod -Method Post -Uri "$cf/projects/$env:PROJECT/upload-file" -TimeoutSec 300 -Headers $cfHeaders -Form @{ metadata = $metadata; file = Get-Item -LiteralPath $zip } -SkipHttpErrorCheck -StatusCodeVariable code
          $fileId = if ($null -ne $response -and $response -isnot [string] -and $response.PSObject.Properties['id']) { [string]$response.id } else { '' }
          if ($code -ne 200 -or $fileId -notmatch '^[1-9]\d*$') {
            $said = if ($response -is [string]) { $response } elseif ($null -ne $response) { $response | ConvertTo-Json -Depth 4 -Compress } else { 'an empty body' }
            if ($said.Length -gt 500) { $said = $said.Substring(0, 500) }
            Write-Host "::error title=curseforge::CurseForge answered $code with no file id: $(Protect-Message $said). $finish"
            exit 1
          }
          Write-Host "curseforge: file $fileId uploaded to project $env:PROJECT"
          "file=$fileId", "type=$releaseType", "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Put the summary on the run
        if: always()
        shell: pwsh
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          TOC_OUTCOME: ${{ steps.curseforge-toc.outcome }}
          PROJECT: ${{ steps.curseforge-toc.outputs.project }}
          VERSIONS: ${{ steps.curseforge-toc.outputs.versions }}
          FOREVER: ${{ steps.curseforge-toc.outputs.forever }}
          RERUN_OUTCOME: ${{ steps.curseforge-rerun.outcome }}
          RERUN_UPLOADED: ${{ steps.curseforge-rerun.outputs.uploaded }}
          RERUN_ATTEMPT: ${{ steps.curseforge-rerun.outputs.attempt }}
          UPLOAD_OUTCOME: ${{ steps.curseforge-upload.outcome }}
          SENT: ${{ steps.curseforge-upload.outputs.sent }}
          LEFT: ${{ steps.curseforge-upload.outputs.left }}
          FILE_ID: ${{ steps.curseforge-upload.outputs.file }}
          RELEASE_TYPE: ${{ steps.curseforge-upload.outputs.type }}
          ZIP_SHA: ${{ steps.curseforge-upload.outputs.sha }}
        run: |
          $out = @('## CurseForge', '', '```text')
          $out += "version  $env:VERSION"
          if ($env:TOC_OUTCOME -ne 'success') { $out += "curseforge: not uploaded, the .toc step reads $(if ($env:TOC_OUTCOME) { $env:TOC_OUTCOME } else { 'not run' })" }
          else {
            $out += "project  $env:PROJECT", "game     $($env:VERSIONS -replace ',', ', ')", "forever  $(if ($env:FOREVER) { $env:FOREVER -replace ',', ', ' } else { 'none' })"
            if ($env:SENT) { $out += "sent     $($env:SENT -replace ',', ', ')", "left out $(if ($env:LEFT) { $env:LEFT } else { 'none' })" }
            if ($env:RERUN_OUTCOME -ne 'success') { $out += "curseforge: not uploaded, the rerun read reads $(if ($env:RERUN_OUTCOME) { $env:RERUN_OUTCOME } else { 'not run' })" }
            elseif ($env:RERUN_UPLOADED -eq 'true') { $out += "curseforge: skipped, attempt $env:RERUN_ATTEMPT of this run uploaded the file (read off this run's earlier attempts, since CurseForge lists no project files)" }
            elseif ($env:UPLOAD_OUTCOME -eq 'success') { $out += "curseforge: file $env:FILE_ID uploaded as $env:RELEASE_TYPE", "zip      sha256 $env:ZIP_SHA" }
            else { $out += "curseforge: not uploaded, the upload step reads $(if ($env:UPLOAD_OUTCOME) { $env:UPLOAD_OUTCOME } else { 'not run' })" }
          }
          $out += '```'
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $out | Write-Host

  # The Wago upload: the same zip goes to the Wago Addons project the shipped .toc's ## X-Wago-ID:
  # line names. It runs on the same condition as the CurseForge job and beside it, so a failure on
  # one site leaves the other's upload alone and "Re-run failed jobs" retries only the one that failed.
  wago:
    name: wago
    needs: publish
    if: needs.publish.outputs.state == 'published' || needs.publish.outputs.state == 'already'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The game versions are read off ## Interface: by the same digit pairs the CurseForge job uses,
      # a 16xxx value going to the forever output.
      - name: Read the Wago project and game versions off the shipped .toc
        id: wago-toc
        shell: pwsh
        run: |
          $toc = 'WowPvpHistory/WowPvpHistory.toc'
          if (-not (Test-Path -LiteralPath $toc -PathType Leaf)) {
            Write-Host "::error title=wago::This commit carries no $toc to read the Wago project off."
            exit 1
          }
          $lines = @(Get-Content -LiteralPath $toc)
          $ids = @($lines | Where-Object { $_ -match '^##\s*X-Wago-ID:' })
          if ($ids.Count -ne 1) {
            Write-Host "::error title=wago::$toc carries $($ids.Count) ## X-Wago-ID: lines where one was expected."
            exit 1
          }
          if ($ids[0] -cnotmatch '^##\s*X-Wago-ID:\s*([A-Za-z0-9]{8})\s*$') {
            Write-Host "::error title=wago::The ## X-Wago-ID: line of $toc names no eight-character project."
            exit 1
          }
          $project = $Matches[1]
          $interfaces = @($lines | Where-Object { $_ -match '^##\s*Interface:' })
          if ($interfaces.Count -ne 1) {
            Write-Host "::error title=wago::$toc carries $($interfaces.Count) ## Interface: lines where one was expected."
            exit 1
          }
          $names = [System.Collections.Generic.List[string]]::new()
          $forever = [System.Collections.Generic.List[string]]::new()
          foreach ($value in (($interfaces[0] -replace '^##\s*Interface:', '').Trim() -split '\s*,\s*')) {
            if ($value -notmatch '^[1-9]\d{4,5}$') {
              Write-Host "::error title=wago::The ## Interface: value '$value' is no interface number, so no game version can be named for it."
              exit 1
            }
            $n = [int]$value
            $name = '{0}.{1}.{2}' -f [int][math]::Truncate($n / 10000), ([int][math]::Truncate($n / 100) % 100), ($n % 100)
            $into = $names
            if ($value -match '^16\d{3}$') { $into = $forever }
            if (-not $into.Contains($name)) { $into.Add($name) }
          }
          Write-Host "wago: project $project, game versions $($names -join ', '), Forever $(if ($forever.Count -gt 0) { $forever -join ', ' } else { 'none' })"
          "project=$project", "versions=$($names -join ',')", "forever=$($forever -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Whether Wago's API lists a project's versions is not read here, so a second copy is told
      # apart off this run's own earlier attempts, as the CurseForge job does.
      - name: Read whether an earlier attempt of this run uploaded the file
        id: wago-rerun
        shell: pwsh
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $attempt = [int]$env:GITHUB_RUN_ATTEMPT
          $found = 0
          if ($attempt -gt 1) {
            $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $headers = @{ Authorization = "Bearer $env:READ_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            for ($n = 1; $n -lt $attempt; $n++) {
              $jobs = Invoke-RestMethod -Uri "$api/attempts/$n/jobs?per_page=100" -TimeoutSec 60 -Headers $headers
              if (@($jobs.jobs | Where-Object { $_.name -ceq 'wago' -and $_.conclusion -ceq 'success' }).Count -gt 0) { $found = $n; break }
            }
          }
          if ($found -gt 0) { Write-Host "rerun: attempt $found of this run uploaded the file, so attempt $attempt uploads nothing" }
          else { Write-Host "rerun: none of the $($attempt - 1) earlier attempt(s) of this run uploaded the file" }
          "uploaded=$(if ($found -gt 0) { 'true' } else { 'false' })", "attempt=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The Wago token is handed to this step alone, in a header from the environment. The metadata
      # carries the fields the BigWigs packager sends (L2, its release.sh, read 2026-10-13 and
      # 2026-10-24): label, supported_retail_patches, supported_forever_patches where a Forever
      # version is sent, stability and changelog. Each Retail version has to be one Wago's game data
      # lists for retail, or the job fails naming it; a Forever version its forever list does not
      # carry is left out and named.
      - name: Upload the release zip to Wago
        id: wago-upload
        if: steps.wago-rerun.outputs.uploaded != 'true'
        shell: pwsh
        env:
          WAGO_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          PROJECT: ${{ steps.wago-toc.outputs.project }}
          VERSIONS: ${{ steps.wago-toc.outputs.versions }}
          FOREVER: ${{ steps.wago-toc.outputs.forever }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The message of an annotation escapes percent, CR and LF, so a host's answer stays one message and
          # no line of it reads as a workflow command. The title is a fixed word and is not escaped.
          function Protect-Message([string] $Text) { $Text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A') }
          $finish = "The release v$env:VERSION is published on GitHub and not on Wago; use Re-run failed jobs once this is fixed."
          if ([string]::IsNullOrWhiteSpace($env:WAGO_TOKEN)) { Write-Host "::error title=wago::WAGO_API_TOKEN is not set on this repository. $finish"; exit 1 }
          if ([string]::IsNullOrWhiteSpace($env:VERSION) -or [string]::IsNullOrWhiteSpace($env:PROJECT) -or [string]::IsNullOrWhiteSpace($env:VERSIONS)) {
            Write-Host "::error title=wago::The version, the project or the game versions did not reach this step. $finish"
            exit 1
          }
          $code = 0
          $game = Invoke-RestMethod -Uri 'https://addons.wago.io/api/data/game' -TimeoutSec 60 -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -ne 200) { Write-Host "::error title=wago::Wago's game data answered $code. $finish"; exit 1 }
          $retail = @()
          if ($null -ne $game -and $game -isnot [string] -and $game.PSObject.Properties['patches'] -and $game.patches.PSObject.Properties['retail']) {
            $listed = $game.patches.retail
            $retail = @($listed | ForEach-Object { [string]$_ })
          }
          if ($retail.Count -eq 0) { Write-Host "::error title=wago::Wago's game data lists no retail patch. $finish"; exit 1 }
          $patches = [System.Collections.Generic.List[string]]::new()
          foreach ($name in ($env:VERSIONS -split ',')) {
            if ($retail -cnotcontains $name) { Write-Host "::error title=wago::Wago lists no retail patch named $name, of $($retail.Count) listed. $finish"; exit 1 }
            $patches.Add($name)
          }
          $foreverListed = @()
          $foreverKey = $false
          if ($null -ne $game -and $game -isnot [string] -and $game.PSObject.Properties['patches'] -and $game.patches.PSObject.Properties['forever']) {
            $foreverKey = $true
            $foreverListed = @($game.patches.forever | ForEach-Object { [string]$_ })
          }
          $foreverPatches = [System.Collections.Generic.List[string]]::new()
          $left = [System.Collections.Generic.List[string]]::new()
          foreach ($name in @(([string]$env:FOREVER -split ',') | Where-Object { $_ })) {
            if ($foreverListed -ccontains $name) { $foreverPatches.Add($name); continue }
            # Game data with no forever list and a forever list holding nothing are two readings.
            $reason = if (-not $foreverKey) { "Wago's game data carries no forever list" }
              elseif ($foreverListed.Count -eq 0) { "Wago's forever list holds no patch" }
              else { "Wago lists no forever patch of that name, of $($foreverListed.Count) listed" }
            $left.Add("$name (Forever: $reason)")
            Write-Host "wago: Forever $name is left out, $reason"
          }
          "sent=$((@($patches) + @($foreverPatches)) -join ',')", "left=$($left -join '; ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod -Uri "$api/releases/tags/v$env:VERSION" -TimeoutSec 60 -Headers $headers
          $assets = @($release.assets)
          if ($assets.Count -ne 1 -or -not ([string]$assets[0].name).EndsWith('.zip')) { Write-Host "::error title=wago::The release v$env:VERSION carries $($assets.Count) assets where the zip is one. $finish"; exit 1 }
          if ([string]::IsNullOrWhiteSpace($release.body)) { Write-Host "::error title=wago::The release v$env:VERSION carries no body to send as the changelog. $finish"; exit 1 }
          $zip = Join-Path $env:RUNNER_TEMP $assets[0].name
          Invoke-WebRequest -Uri $assets[0].url -TimeoutSec 300 -Headers @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/octet-stream' } -OutFile $zip
          $size = (Get-Item -LiteralPath $zip).Length
          if ($size -ne [long]$assets[0].size) { Write-Host "::error title=wago::The zip downloaded at $size bytes and the release lists $($assets[0].size). $finish"; exit 1 }
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $stability = if ($env:PRERELEASE -eq 'true') { 'beta' } else { 'stable' }
          $fields = [ordered]@{
            label                    = $env:VERSION
            supported_retail_patches = [string[]]$patches.ToArray()
          }
          if ($foreverPatches.Count -gt 0) { $fields['supported_forever_patches'] = [string[]]$foreverPatches.ToArray() }
          $fields['stability'] = $stability
          $fields['changelog'] = [string]$release.body
          $metadata = $fields | ConvertTo-Json -Depth 3 -Compress
          $wagoHeaders = @{ Authorization = "Bearer $env:WAGO_TOKEN"; Accept = 'application/json' }
          Write-Host "uploading: $($assets[0].name), $size bytes, sha256 $sha, $stability, patches $($patches -join ', '), forever patches $(if ($foreverPatches.Count -gt 0) { $foreverPatches -join ', ' } else { 'none' })"
          # Trap: Wago redirects a refused upload, and a followed redirect answers 200 off the page it lands on, so no redirect is followed and a 3xx fails below.
          $response = Invoke-RestMethod -Method Post -Uri "https://addons.wago.io/api/projects/$env:PROJECT/version" -TimeoutSec 300 -Headers $wagoHeaders -Form @{ metadata = $metadata; file = Get-Item -LiteralPath $zip } -MaximumRedirection 0 -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -ne 200 -and $code -ne 201) {
            $said = if ($response -is [string]) { $response } elseif ($null -ne $response) { $response | ConvertTo-Json -Depth 4 -Compress } else { 'an empty body' }
            if ($said.Length -gt 500) { $said = $said.Substring(0, 500) }
            Write-Host "::error title=wago::Wago answered ${code}: $(Protect-Message $said). $finish"
            exit 1
          }
          Write-Host "wago: answered $code, version $env:VERSION uploaded to project $env:PROJECT"
          "code=$code", "stability=$stability", "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Put the summary on the run
        if: always()
        shell: pwsh
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          TOC_OUTCOME: ${{ steps.wago-toc.outcome }}
          PROJECT: ${{ steps.wago-toc.outputs.project }}
          VERSIONS: ${{ steps.wago-toc.outputs.versions }}
          FOREVER: ${{ steps.wago-toc.outputs.forever }}
          RERUN_OUTCOME: ${{ steps.wago-rerun.outcome }}
          RERUN_UPLOADED: ${{ steps.wago-rerun.outputs.uploaded }}
          RERUN_ATTEMPT: ${{ steps.wago-rerun.outputs.attempt }}
          UPLOAD_OUTCOME: ${{ steps.wago-upload.outcome }}
          SENT: ${{ steps.wago-upload.outputs.sent }}
          LEFT: ${{ steps.wago-upload.outputs.left }}
          UPLOAD_CODE: ${{ steps.wago-upload.outputs.code }}
          STABILITY: ${{ steps.wago-upload.outputs.stability }}
          ZIP_SHA: ${{ steps.wago-upload.outputs.sha }}
        run: |
          $out = @('## Wago', '', '```text')
          $out += "version  $env:VERSION"
          if ($env:TOC_OUTCOME -ne 'success') { $out += "wago: not uploaded, the .toc step reads $(if ($env:TOC_OUTCOME) { $env:TOC_OUTCOME } else { 'not run' })" }
          else {
            $out += "project  $env:PROJECT", "game     $($env:VERSIONS -replace ',', ', ')", "forever  $(if ($env:FOREVER) { $env:FOREVER -replace ',', ', ' } else { 'none' })"
            if ($env:SENT) { $out += "sent     $($env:SENT -replace ',', ', ')", "left out $(if ($env:LEFT) { $env:LEFT } else { 'none' })" }
            if ($env:RERUN_OUTCOME -ne 'success') { $out += "wago: not uploaded, the rerun read reads $(if ($env:RERUN_OUTCOME) { $env:RERUN_OUTCOME } else { 'not run' })" }
            elseif ($env:RERUN_UPLOADED -eq 'true') { $out += "wago: skipped, attempt $env:RERUN_ATTEMPT of this run uploaded the file" }
            elseif ($env:UPLOAD_OUTCOME -eq 'success') { $out += "wago: uploaded as $env:STABILITY, answered $env:UPLOAD_CODE", "zip      sha256 $env:ZIP_SHA" }
            else { $out += "wago: not uploaded, the upload step reads $(if ($env:UPLOAD_OUTCOME) { $env:UPLOAD_OUTCOME } else { 'not run' })" }
          }
          $out += '```'
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $out | Write-Host

  # The WoWInterface upload: a final release's zip goes to the WoWInterface project the shipped
  # .toc's ## X-WoWI-ID: line names. It runs on the same condition as the other two upload jobs and
  # beside them, so a failure on one site leaves the others alone and "Re-run failed jobs" retries
  # only the one that failed.
  wowi:
    name: wowi
    needs: publish
    if: needs.publish.outputs.state == 'published' || needs.publish.outputs.state == 'already'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # WoWInterface has no beta channel, so a candidate uploaded there would show as an ordinary
      # release. A pre-release flag that is neither true nor false fails rather than reading as a final.
      - name: Read whether the release is a candidate
        id: wowi-candidate
        shell: pwsh
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          if ($env:PRERELEASE -ceq 'true') {
            Write-Host "wowi: skipped, v$env:VERSION is a release candidate"
            'skip=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          if ($env:PRERELEASE -cne 'false') {
            Write-Host "::error title=wowi::The publish job's pre-release flag reads '$env:PRERELEASE', so whether v$env:VERSION is a candidate is not settled."
            exit 1
          }
          Write-Host "wowi: v$env:VERSION is a final release"
          'skip=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The game versions are read off ## Interface: by the same digit pairs the other two jobs use,
      # a 16xxx value going to the forever output.
      - name: Read the WoWInterface project and game versions off the shipped .toc
        id: wowi-toc
        if: steps.wowi-candidate.outputs.skip == 'false'
        shell: pwsh
        run: |
          $toc = 'WowPvpHistory/WowPvpHistory.toc'
          if (-not (Test-Path -LiteralPath $toc -PathType Leaf)) {
            Write-Host "::error title=wowi::This commit carries no $toc to read the WoWInterface project off."
            exit 1
          }
          $lines = @(Get-Content -LiteralPath $toc)
          $ids = @($lines | Where-Object { $_ -match '^##\s*X-WoWI-ID:' })
          if ($ids.Count -ne 1) {
            Write-Host "::error title=wowi::$toc carries $($ids.Count) ## X-WoWI-ID: lines where one was expected."
            exit 1
          }
          if ($ids[0] -notmatch '^##\s*X-WoWI-ID:\s*([1-9]\d*)\s*$') {
            Write-Host "::error title=wowi::The ## X-WoWI-ID: line of $toc names no numeric project."
            exit 1
          }
          $project = $Matches[1]
          $interfaces = @($lines | Where-Object { $_ -match '^##\s*Interface:' })
          if ($interfaces.Count -ne 1) {
            Write-Host "::error title=wowi::$toc carries $($interfaces.Count) ## Interface: lines where one was expected."
            exit 1
          }
          $names = [System.Collections.Generic.List[string]]::new()
          $forever = [System.Collections.Generic.List[string]]::new()
          foreach ($value in (($interfaces[0] -replace '^##\s*Interface:', '').Trim() -split '\s*,\s*')) {
            if ($value -notmatch '^[1-9]\d{4,5}$') {
              Write-Host "::error title=wowi::The ## Interface: value '$value' is no interface number, so no game version can be named for it."
              exit 1
            }
            $n = [int]$value
            $name = '{0}.{1}.{2}' -f [int][math]::Truncate($n / 10000), ([int][math]::Truncate($n / 100) % 100), ($n % 100)
            $into = $names
            if ($value -match '^16\d{3}$') { $into = $forever }
            if (-not $into.Contains($name)) { $into.Add($name) }
          }
          Write-Host "wowi: project $project, game versions $($names -join ', '), Forever $(if ($forever.Count -gt 0) { $forever -join ', ' } else { 'none' })"
          "project=$project", "versions=$($names -join ',')", "forever=$($forever -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # WoWInterface's list of game versions has lagged the client (L1, 2026-10-16: newest 12.1.0
      # against a client at 12.1.5), so a version it does not carry is left out and named rather than
      # failing every release. Entries are matched on id, since older ones carry a null interface,
      # and no lower version is sent in place of one left out. A Forever version is kept only where
      # the list carries it under a game named Forever; it carried none (L1, 2026-10-24, its games
      # being Retail, Classic, TBC-Classic, WOTLK-Classic and Cata-Classic), so it is left out and
      # named, and the upload goes with the Retail versions alone.
      - name: Keep the game versions WoWInterface lists
        id: wowi-versions
        if: steps.wowi-candidate.outputs.skip == 'false'
        shell: pwsh
        env:
          VERSIONS: ${{ steps.wowi-toc.outputs.versions }}
          FOREVER: ${{ steps.wowi-toc.outputs.forever }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VERSIONS)) { Write-Host "::error title=wowi::The game versions did not reach this step."; exit 1 }
          $code = 0
          # Trap: Invoke-RestMethod writes a JSON list as one object, so the answer is assigned before it is walked.
          $answer = Invoke-RestMethod -Uri 'https://api.wowinterface.com/addons/compatible.json' -TimeoutSec 60 -SkipHttpErrorCheck -StatusCodeVariable code
          $rows = @($answer | Where-Object { $null -ne $_ -and $_ -isnot [string] -and $_.PSObject.Properties['id'] -and $_.PSObject.Properties['game'] })
          if ($code -ne 200 -or $rows.Count -eq 0) { Write-Host "::error title=wowi::WoWInterface's game version list answered $code with $($rows.Count) entries."; exit 1 }
          $retail = @($rows | Where-Object { [string]$_.game -ceq 'Retail' } | ForEach-Object { [string]$_.id })
          $kept = [System.Collections.Generic.List[string]]::new()
          $dropped = [System.Collections.Generic.List[string]]::new()
          foreach ($name in ($env:VERSIONS -split ',')) {
            if ($retail -ccontains $name) { $kept.Add($name) } else { $dropped.Add($name) }
          }
          if ($kept.Count -eq 0) { Write-Host "::error title=wowi::WoWInterface lists none of $($env:VERSIONS -replace ',', ', '), of $($retail.Count) Retail versions listed."; exit 1 }
          $foreverListed = @($rows | Where-Object { [string]$_.game -ceq 'Forever' } | ForEach-Object { [string]$_.id })
          $left = [System.Collections.Generic.List[string]]::new()
          foreach ($name in @(([string]$env:FOREVER -split ',') | Where-Object { $_ })) {
            if ($foreverListed -ccontains $name) { $kept.Add($name); continue }
            $reason = if ($foreverListed.Count -eq 0) { 'WoWInterface lists no Forever game' } else { "WoWInterface lists no Forever version of that name, of $($foreverListed.Count) there" }
            $left.Add("$name (Forever: $reason)")
            Write-Host "wowi: Forever $name is left out, $reason"
          }
          $sent = @($kept | Sort-Object -Property { [version]$_ } -Descending)
          foreach ($name in $dropped) { Write-Host "wowi: $name is not on WoWInterface's list, sent $($sent -join ', ')" }
          Write-Host "wowi: game versions $($sent -join ', ') of $($retail.Count) Retail versions listed"
          "versions=$($sent -join ',')", "dropped=$($dropped -join ',')", "left=$($left -join '; ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Whether WoWInterface's API lists a project's files is not read here, so a second copy is told
      # apart off this run's own earlier attempts, as the other two jobs do.
      - name: Read whether an earlier attempt of this run uploaded the file
        id: wowi-rerun
        if: steps.wowi-candidate.outputs.skip == 'false'
        shell: pwsh
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $attempt = [int]$env:GITHUB_RUN_ATTEMPT
          $found = 0
          if ($attempt -gt 1) {
            $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $headers = @{ Authorization = "Bearer $env:READ_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            for ($n = 1; $n -lt $attempt; $n++) {
              $jobs = Invoke-RestMethod -Uri "$api/attempts/$n/jobs?per_page=100" -TimeoutSec 60 -Headers $headers
              if (@($jobs.jobs | Where-Object { $_.name -ceq 'wowi' -and $_.conclusion -ceq 'success' }).Count -gt 0) { $found = $n; break }
            }
          }
          if ($found -gt 0) { Write-Host "rerun: attempt $found of this run uploaded the file, so attempt $attempt uploads nothing" }
          else { Write-Host "rerun: none of the $($attempt - 1) earlier attempt(s) of this run uploaded the file" }
          "uploaded=$(if ($found -gt 0) { 'true' } else { 'false' })", "attempt=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The WoWInterface token is handed to this step alone, in a header from the environment. The
      # fields are the ones the BigWigs packager sends (L2, its release.sh, read 2026-10-16), and 202
      # is the only answer it reads as success. archive is not sent, so WoWInterface keeps its
      # default of archiving the previous file.
      - name: Upload the release zip to WoWInterface
        id: wowi-upload
        if: steps.wowi-candidate.outputs.skip == 'false' && steps.wowi-rerun.outputs.uploaded != 'true'
        shell: pwsh
        env:
          WOWI_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          PROJECT: ${{ steps.wowi-toc.outputs.project }}
          VERSIONS: ${{ steps.wowi-versions.outputs.versions }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The message of an annotation escapes percent, CR and LF, so a host's answer stays one message and
          # no line of it reads as a workflow command. The title is a fixed word and is not escaped.
          function Protect-Message([string] $Text) { $Text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A') }
          $finish = "The release v$env:VERSION is published on GitHub and not on WoWInterface; use Re-run failed jobs once this is fixed."
          if ([string]::IsNullOrWhiteSpace($env:WOWI_TOKEN)) { Write-Host "::error title=wowi::WOWI_API_TOKEN is not set on this repository. $finish"; exit 1 }
          if ([string]::IsNullOrWhiteSpace($env:VERSION) -or [string]::IsNullOrWhiteSpace($env:PROJECT) -or [string]::IsNullOrWhiteSpace($env:VERSIONS)) {
            Write-Host "::error title=wowi::The version, the project or the game versions did not reach this step. $finish"
            exit 1
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod -Uri "$api/releases/tags/v$env:VERSION" -TimeoutSec 60 -Headers $headers
          $assets = @($release.assets)
          if ($assets.Count -ne 1 -or -not ([string]$assets[0].name).EndsWith('.zip')) { Write-Host "::error title=wowi::The release v$env:VERSION carries $($assets.Count) assets where the zip is one. $finish"; exit 1 }
          if ([string]::IsNullOrWhiteSpace($release.body)) { Write-Host "::error title=wowi::The release v$env:VERSION carries no body to send as the changelog. $finish"; exit 1 }
          $zip = Join-Path $env:RUNNER_TEMP $assets[0].name
          Invoke-WebRequest -Uri $assets[0].url -TimeoutSec 300 -Headers @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/octet-stream' } -OutFile $zip
          $size = (Get-Item -LiteralPath $zip).Length
          if ($size -ne [long]$assets[0].size) { Write-Host "::error title=wowi::The zip downloaded at $size bytes and the release lists $($assets[0].size). $finish"; exit 1 }
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $form = @{
            id         = $env:PROJECT
            version    = $env:VERSION
            compatible = $env:VERSIONS
            changelog  = [string]$release.body
            updatefile = Get-Item -LiteralPath $zip
          }
          Write-Host "uploading: $($assets[0].name), $size bytes, sha256 $sha, game versions $($env:VERSIONS -replace ',', ', ')"
          $code = 0
          # Trap: a followed redirect answers 200 off the page it lands on, so no redirect is followed and anything but 202 fails below.
          $response = Invoke-RestMethod -Method Post -Uri 'https://api.wowinterface.com/addons/update' -TimeoutSec 300 -Headers @{ 'x-api-token' = $env:WOWI_TOKEN } -Form $form -MaximumRedirection 0 -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -ne 202) {
            $said = if ($response -is [string]) { $response } elseif ($null -ne $response) { $response | ConvertTo-Json -Depth 4 -Compress } else { 'an empty body' }
            if ($said.Length -gt 500) { $said = $said.Substring(0, 500) }
            $meaning = switch ($code) {
              401 { "no addon under project $env:PROJECT, or no permission to upload to it ($said)" }
              403 { "a wrong token, or no permission to upload ($said)" }
              default { $said }
            }
            Write-Host "::error title=wowi::WoWInterface answered ${code}: $(Protect-Message $meaning). $finish"
            exit 1
          }
          Write-Host "wowi: answered 202, version $env:VERSION uploaded to project $env:PROJECT"
          "code=$code", "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Put the summary on the run
        if: always()
        shell: pwsh
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          CANDIDATE_OUTCOME: ${{ steps.wowi-candidate.outcome }}
          SKIP: ${{ steps.wowi-candidate.outputs.skip }}
          TOC_OUTCOME: ${{ steps.wowi-toc.outcome }}
          PROJECT: ${{ steps.wowi-toc.outputs.project }}
          VERSIONS_OUTCOME: ${{ steps.wowi-versions.outcome }}
          SENT: ${{ steps.wowi-versions.outputs.versions }}
          DROPPED: ${{ steps.wowi-versions.outputs.dropped }}
          LEFT: ${{ steps.wowi-versions.outputs.left }}
          RERUN_OUTCOME: ${{ steps.wowi-rerun.outcome }}
          RERUN_UPLOADED: ${{ steps.wowi-rerun.outputs.uploaded }}
          RERUN_ATTEMPT: ${{ steps.wowi-rerun.outputs.attempt }}
          UPLOAD_OUTCOME: ${{ steps.wowi-upload.outcome }}
          UPLOAD_CODE: ${{ steps.wowi-upload.outputs.code }}
          ZIP_SHA: ${{ steps.wowi-upload.outputs.sha }}
        run: |
          $out = @('## WoWInterface', '', '```text')
          $out += "version  $env:VERSION"
          $reads = { param($outcome) if ($outcome) { $outcome } else { 'not run' } }
          if ($env:CANDIDATE_OUTCOME -ne 'success') { $out += "wowi: not uploaded, the candidate read reads $(& $reads $env:CANDIDATE_OUTCOME)" }
          elseif ($env:SKIP -eq 'true') { $out += "wowi: skipped, v$env:VERSION is a release candidate" }
          elseif ($env:TOC_OUTCOME -ne 'success') { $out += "wowi: not uploaded, the .toc step reads $(& $reads $env:TOC_OUTCOME)" }
          else {
            $out += "project  $env:PROJECT"
            if ($env:VERSIONS_OUTCOME -ne 'success') { $out += "wowi: not uploaded, the game version step reads $(& $reads $env:VERSIONS_OUTCOME)" }
            else {
              $out += "game     $($env:SENT -replace ',', ', ')", "dropped  $(if ($env:DROPPED) { $env:DROPPED -replace ',', ', ' } else { 'none' })", "left out $(if ($env:LEFT) { $env:LEFT } else { 'none' })"
              if ($env:RERUN_OUTCOME -ne 'success') { $out += "wowi: not uploaded, the rerun read reads $(& $reads $env:RERUN_OUTCOME)" }
              elseif ($env:RERUN_UPLOADED -eq 'true') { $out += "wowi: skipped, attempt $env:RERUN_ATTEMPT of this run uploaded the file" }
              elseif ($env:UPLOAD_OUTCOME -eq 'success') { $out += "wowi: uploaded, answered $env:UPLOAD_CODE", "zip      sha256 $env:ZIP_SHA" }
              else { $out += "wowi: not uploaded, the upload step reads $(& $reads $env:UPLOAD_OUTCOME)" }
            }
          }
          $out += '```'
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $out | Write-Host
